name = 'soc-codex'
main="worker/index.js"
compatibility_date = "2026-05-05"
compatibility_flags = [ "nodejs_compat" ]
preview_urls = true

[observability.logs]
enabled = false

[placement]
mode = "smart"

[[kv_namespaces]]
binding = "ANALYTICS"
id = "4f0f1100479945b587dc77627bcb774a"

[assets]
directory = "./dist"
not_found_handling = "404-page"
html_handling = "force-trailing-slash"
run_worker_first = ["/~*"]

